name: Bug report
description: Something in loadout, bootstrap or the plugin does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security problems go through the private advisory form instead (see the "New issue" page), never here.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      placeholder: "`loadout adopt --apply` stopped with ... I expected ..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands you ran, in order. A fresh or existing setup? Which bootstrap flags?
      placeholder: |
        1. cd ~ && curl ... | bash -s -- --install
        2. loadout adopt --apply
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows with WSL 2
        - Windows (native, experimental)
        - Other
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: loadout version
      description: The output of `loadout --version`.
      placeholder: loadout 0.1.0 (54af5b7)
    validations:
      required: true
  - type: dropdown
    id: agents
    attributes:
      label: Agents and editors you use with loadout
      description: Pick every one that applies. Say in the description which window the problem happened in (for example a VS Code window or a WSL terminal).
      multiple: true
      options:
        - Claude Code CLI
        - Claude Code in VS Code (extension)
        - Codex CLI
        - Codex in VS Code (extension)
    validations:
      required: true
  - type: input
    id: agent-versions
    attributes:
      label: Agent versions
      description: Optional. For each agent above, `claude --version` or `codex --version`, or the extension's version in VS Code's Extensions view.
      placeholder: Claude Code 2.x, Codex extension 0.x
  - type: textarea
    id: check
    attributes:
      label: Output of `loadout check --verbose`
      description: Read it before you paste it, and replace anything private (tokens, names, paths you do not want to share).
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output of the failing command with `--verbose`
      description: Optional. Same care with private data.
      render: shell
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Optional. What you already tried, a workaround, screenshots.
