name: ci
on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python 3.12 --with pytest pytest -q
      - name: hook scripts run under Git Bash (catches CRLF checkouts)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          bash plugins/loadout/hooks/run.sh loadout hook-session-start
          bash plugins/loadout/hooks/run.sh --soft no-such-tool
          bash plugins/loadout/hooks/subagent-context.sh | python -c "import json,sys; json.load(sys.stdin)"

  test-wsl2:
    name: test (wsl2)
    runs-on: windows-latest
    defaults:
      run:
        shell: wsl-bash {0}
    steps:
      - name: check out with LF line endings, as a clone inside WSL would have
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: python3 git curl ca-certificates
      - name: install uv inside WSL
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: tests
        run: ~/.local/bin/uv run --python 3.12 --with pytest pytest -q
      - name: smoke test (WSL 2 detected)
        run: |
          python3 -c "import sys; sys.path.insert(0, 'cli'); from loadout import wsl; v = wsl.detect(); print('detect:', v); assert v == 2"
          out="$(python3 bin/loadout check || true)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -F '[ok  ] WSL 2'
          ! printf '%s\n' "$out" | grep -F 'WSL 1:'

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: claude plugin validate plugins/loadout
