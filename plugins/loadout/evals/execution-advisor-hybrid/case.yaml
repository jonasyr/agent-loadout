schema_version: "1.1"
name: execution-advisor-hybrid
description: >-
  A seven-task plan: Tasks 1-4 are coupled and risky (in-place migration of the user's
  database, a new Store API the later tasks call, an irreversible purge, an importer that
  must not half-import), Tasks 5-7 are independent text edits with the complete content
  given. The advisor must not recommend all-Inline; it must give the risky tasks a
  per-task review and put the mechanical tasks on the cheap model tier.
tags: [execution-advisor]
